name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch approved phase-loop controller baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Fail closed on implementation pull-request author
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.name }}
          PHASE_LOOP_REJECTED_HEAD_SHA: ${{ vars.PHASE_LOOP_REJECTED_HEAD_SHA }}
          PHASE_LOOP_REJECTED_PR_NUMBER: ${{ vars.PHASE_LOOP_REJECTED_PR_NUMBER }}
        run: |
          case "$PR_HEAD_REF" in
            brownie-agent/*|phase-loop/*) ;;
            *) exit 0 ;;
          esac
          if [ "$PR_AUTHOR" != "brownie-agent" ]; then
            echo "Implementation pull-request author guard failed: expected brownie-agent, got $PR_AUTHOR" >&2
            exit 1
          fi
          if [ "$PR_HEAD_OWNER" != "brownie-agent" ] || [ "$PR_HEAD_REPO" != "brownie" ]; then
            echo "Implementation pull-request admission failed: expected head brownie-agent/brownie, got $PR_HEAD_OWNER/$PR_HEAD_REPO" >&2
            exit 1
          fi
          if [ -n "$PHASE_LOOP_REJECTED_HEAD_SHA" ] || [ -n "$PHASE_LOOP_REJECTED_PR_NUMBER" ]; then
            node scripts/phase-loop-pr-author-guard.mjs --event-path "$GITHUB_EVENT_PATH"
          fi
          echo "Implementation pull-request author guard passed for $PR_HEAD_REF."

      - name: Fail closed on stale phase-loop controller source
        run: |
          node --test scripts/phase-loop-source-baseline-guard.test.mjs
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/phase-loop-source-baseline-guard.mjs --repo . --baseline-ref origin/main
          fi

      - name: Fail fast on stale runtime readiness evidence
        run: node scripts/update-runtime-release-readiness-audit.mjs --check

      - name: Fail fast on stale runtime module assessment
        run: node scripts/update-runtime-module-decomposition-assessment.mjs --check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --all-features

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Root workspace check
        timeout-minutes: 15
        run: pnpm --workspace-root check

      - name: Root workspace test
        run: pnpm --workspace-root test

      - name: Root workspace build
        run: pnpm --workspace-root build

      - name: Release gate
        run: pnpm guard:release-gate

      - name: Process-loss E2E test
        run: pnpm test:rrp3-process-loss

      - name: Diagnostics guard
        run: pnpm guard:diagnostics

      - name: Phase value guard
        run: pnpm guard:phase-value

      - name: Phase value guard tests
        run: pnpm guard:phase-value:test

      - name: VSIX check
        run: pnpm --filter brownie-vsix check

      - name: VSIX test
        run: pnpm --filter brownie-vsix test

      - name: VSIX build
        run: pnpm --filter brownie-vsix build

  runtime-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail fast on stale runtime readiness evidence
        run: node scripts/update-runtime-release-readiness-audit.mjs --check

      - name: Fail fast on stale runtime module assessment
        run: node scripts/update-runtime-module-decomposition-assessment.mjs --check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Runtime cargo test
        if: runner.os != 'Windows'
        run: cargo test -p brownie-runtime --all-features

      - name: Verify unsupported index platform fails closed
        if: runner.os == 'Windows'
        run: cargo test -p brownie-indexer unsupported_platform_fails_closed

  index-platform:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail fast on stale runtime readiness evidence
        run: node scripts/update-runtime-release-readiness-audit.mjs --check

      - name: Fail fast on stale runtime module assessment
        run: node scripts/update-runtime-module-decomposition-assessment.mjs --check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify unsupported index platform fails closed
        run: cargo test -p brownie-indexer unsupported_platform_fails_closed
